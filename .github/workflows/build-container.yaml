name: Build and publish CAREamics containers

on:
  workflow_dispatch:
    inputs:
      careamics_version:
        description: "CAREamics version, for example 0.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - variant: gpu
            base_image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          - variant: cpu
            base_image: python:3.11-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          VERSION="${{ github.event.inputs.careamics_version }}"
          OWNER="${{ github.repository_owner }}"
          VARIANT="${{ matrix.variant }}"

          echo "docker_image=ghcr.io/${OWNER}/careamics-${VARIANT}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sif_image=oras://ghcr.io/${OWNER}/careamics-${VARIANT}-sif:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sif_file=careamics-${VARIANT}-${VERSION}.sif" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry for Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            CAREAMICS_VERSION=${{ github.event.inputs.careamics_version }}
          tags: |
            ${{ steps.image.outputs.docker_image }}

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF from Docker image
        run: |
          apptainer build "${{ steps.image.outputs.sif_file }}" \
            "docker://${{ steps.image.outputs.docker_image }}"

      - name: Log in to GitHub Container Registry for Apptainer ORAS
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" \
            --password-stdin oras://ghcr.io

      - name: Push SIF to GHCR
        run: |
          apptainer push "${{ steps.image.outputs.sif_file }}" \
            "${{ steps.image.outputs.sif_image }}"