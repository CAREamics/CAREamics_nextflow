name: Build and publish CAREamics containers

on:
  workflow_dispatch:
    inputs:
      careamics_version:
        description: "CAREamics version, for example 0.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [cpu, gpu]

    env:
      VERSION: ${{ github.event.inputs.careamics_version }}
      OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      - name: Set image names
        # NOTE: ${OWNER,,} makes the variable lower case
        run: |
          echo "DOCKER_IMAGE=ghcr.io/${OWNER,,}/careamics-${{ matrix.variant }}:${VERSION}" >> "$GITHUB_ENV"
          echo "SIF_IMAGE=oras://ghcr.io/${OWNER,,}/careamics-${{ matrix.variant }}-sif:${VERSION}" >> "$GITHUB_ENV"
          echo "SIF_FILE=careamics-${{ matrix.variant }}-${VERSION}.sif" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.variant }}
          push: true
          build-args: |
            CAREAMICS_VERSION=${{ env.VERSION }}
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF
        run: |
          apptainer build "$SIF_FILE" "docker://$DOCKER_IMAGE"

      - name: Log in to GHCR with Apptainer
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" \
            --password-stdin oras://ghcr.io

      - name: Push SIF
        run: |
          apptainer push "$SIF_FILE" "$SIF_IMAGE"