name: Build and publish CAREamics containers

on:
  workflow_dispatch:
    inputs:
      careamics_version:
        description: "CAREamics version, for example 0.2.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ github.event.inputs.careamics_version }}
  OWNER: ${{ github.repository_owner }}
  # NOTE: DO NOT CHANGE CUDA_VERSION WITHOUT UPDATING Dockerfile
  CUDA_VERSION: "11.8"

jobs:
  build_docker:
    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.set_image_name.outputs.docker_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image name
        id: set_image_name
        # NOTE: ${OWNER,,} makes the variable lower case
        run: |
          DOCKER_IMAGE="ghcr.io/${OWNER,,}/careamics:${VERSION}-cuda${CUDA_VERSION}"
          echo "docker_image=$DOCKER_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CAREAMICS_VERSION=${{ env.VERSION }}
          tags: ${{ steps.set_image_name.outputs.docker_image }}

  build_sif:
    needs: build_docker
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: ${{ needs.build_docker.outputs.docker_image }}

    steps:
      - name: Set SIF image name
        # NOTE: ${OWNER,,} makes the variable lower case
        run: |
          echo "SIF_IMAGE=oras://ghcr.io/${OWNER,,}/careamics-sif:${VERSION}-cuda${CUDA_VERSION}" >> "$GITHUB_ENV"
          echo "SIF_FILE=careamics-${VERSION}-cuda${CUDA_VERSION}.sif" >> "$GITHUB_ENV"

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          sudo apt-get clean

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" \
            --password-stdin docker://ghcr.io

      - name: Build SIF
        env:
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
        run: |
          mkdir -p "$APPTAINER_TMPDIR"
          apptainer build --disable-cache "$SIF_FILE" "docker://$DOCKER_IMAGE"

      - name: Push SIF
        run: |
          apptainer push "$SIF_FILE" "$SIF_IMAGE"
