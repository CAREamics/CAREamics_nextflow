repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        priority: 0
        entry: prettier --experimental-cli --write --ignore-unknown --no-cache
        exclude: |
          (?x)^(
            .*\.snap$|
            (.*/)?\.conda/.*
          )$
        additional_dependencies:
          - prettier@3.9.3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 10
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
            .*\.snap$|
            (.*/)?\.conda/.*
          )$
      - id: end-of-file-fixer
        priority: 10
        exclude: |
          (?x)^(
            .*\.snap$|
            (.*/)?\.conda/.*
          )$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-github-workflows
        priority: 20
      - id: check-jsonschema
        priority: 20
        name: "Validate environment.ymls against schema"
        files: ^modules/careamics/.*/environment\.yml$
        types: [yaml]
        args:
          [
            "--schemafile",
            "https://raw.githubusercontent.com/nf-core/modules/refs/heads/master/modules/environment-schema.json",
          ]
      - id: check-jsonschema
        priority: 20
        name: "Validate module meta.yml files"
        files: ^modules/careamics/.*/meta\.yml$
        types: [yaml]
        args:
          [
            "--schemafile",
            "https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json",
          ]
      - id: check-jsonschema
        priority: 20
        name: "Validate subworkflow meta.yml files"
        files: ^subworkflows/careamics/.*/meta\.yml$
        types: [yaml]
        args:
          [
            "--schemafile",
            "https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json",
          ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        priority: 10
        files: \.py$
        args:
          [--fix, --exit-non-zero-on-fix, "--select", "I,E1,E4,E7,E9,F,UP,N"]
      - id: ruff-format
        priority: 0

  - repo: https://github.com/seqeralabs/nf-lint-pre-commit
    rev: v0.3.0
    hooks:
      - id: nextflow-lint
        priority: 0
        files: '\.nf$|nextflow\.config$'
        args: ["-output", "json"]
        # TODO add formatting at a later stage
        # args: ["-format", "-sort-declarations", "-spaces", "4", "-harshil-alignment", "-output", "concise"]
