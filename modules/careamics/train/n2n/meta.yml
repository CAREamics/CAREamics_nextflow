# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_train_n2n
description: Train a Noise2Noise (N2N) denoising model using CAREamics
keywords:
  - denoising
  - microscopy
  - deep learning
  - careamics
  - noise2noise
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id: 'test' ]
  - train_data:
      type: file
      description: Noisy training data as a .tif, .tiff, or .czi file, .zarr store, or directory containing image files
      pattern: "*.{tif,tiff,czi,zarr}"
  - train_inner_zarr_path:
      type: string
      description: Optional relative inner path to a zarr group within train_data. Leave null or empty to use train_data directly.
      pattern: "^(|[^/\\s][^\\s]*)$"
  - train_target:
      type: file
      description: Noisy target data from a different noise source as a .tif, .tiff, or .czi file, .zarr store, or directory containing image files
      pattern: "*.{tif,tiff,czi,zarr}"
  - train_target_inner_zarr_path:
      type: string
      description: Optional relative inner path to a zarr group within train_target. Leave null or empty to use train_target directly.
      pattern: "^(|[^/\\s][^\\s]*)$"
  - val_data:
      type: file
      description: Optional validation data as a .tif, .tiff, or .czi file, .zarr store, or directory containing image files
      pattern: "*.{tif,tiff,czi,zarr}"
  - val_inner_zarr_path:
      type: string
      description: Optional relative inner path to a zarr group within val_data. Leave null or empty to use val_data directly.
      pattern: "^(|[^/\\s][^\\s]*)$"
  - val_target:
      type: file
      description: Optional noisy validation target data from a different noise source as a .tif, .tiff, or .czi file, .zarr store, or directory containing image files
      pattern: "*.{tif,tiff,czi,zarr}"
  - val_target_inner_zarr_path:
      type: string
      description: Optional relative inner path to a zarr group within val_target. Leave null or empty to use val_target directly.
      pattern: "^(|[^/\\s][^\\s]*)$"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id: 'test' ]
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - model:
      type: file
      description: Trained model checkpoint
      pattern: "*.ckpt"
  - config:
      type: file
      description: Training configuration file
      pattern: "config.yaml"
authors:
  - "@yourusername"
maintainers:
  - "@yourusername"
