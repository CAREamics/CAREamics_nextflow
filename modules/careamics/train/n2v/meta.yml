# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_train_n2v
description: Train a Noise2Void (N2V) denoising model using CAREamics
keywords:
  - denoising
  - microscopy
  - deep learning
  - careamics
  - noise2void
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id: 'test', algorithm: 'n2v' ]
  - train_data:
      type: directory
      description: Directory containing training data
      pattern: "*.{tif,tiff,zarr,czi}"
  - val_data:
      type: directory
      description: Optional directory containing validation data
      pattern: "*.{tif,tiff,zarr,czi}"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id: 'test', algorithm: 'n2v' ]
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - model:
      type: file
      description: Trained model checkpoint
      pattern: "*.ckpt"
  - config:
      type: file
      description: Training configuration file
      pattern: "config.yaml"
authors:
  - "@yourusername"
maintainers:
  - "@yourusername"
