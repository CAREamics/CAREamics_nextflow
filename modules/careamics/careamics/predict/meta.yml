# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_predict
description: Apply a trained CAREamics model to images
keywords:
  - image restoration
  - image processing
  - microscopy
  - deep learning
  - careamics
  - prediction
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information; passed through unchanged
    - data:
        type: file
        description: Data to denoise as a single TIFF file or a directory containing TIFF files
        pattern: "*"
    - model:
        type: file
        description: Trained model checkpoint
        pattern: "*.ckpt"
output:
  predictions:
    - - meta:
          type: map
          description: Groovy Map containing sample information; passed through unchanged
      - "predictions/*":
          type: file
          description: Denoised predictions
          pattern: "predictions/*"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@tatianawoller"
  - "@melisande-c"
maintainers:
  - "@melisande-c"
