# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_train
description: Train a CAREamics model from an existing CAREamics configuration file
keywords:
  - training
  - image restoration
  - image processing
  - microscopy
  - deep learning
  - careamics
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information; passed through unchanged
    - careamics_config:
        type: file
        description: CAREamics configuration file
        pattern: "*.yaml"
    - train_data:
        type: file
        description: Training data as a TIFF file or a directory containing TIFF files; passed directly to the training script.
        pattern: "*"
    - train_target:
        type: file
        description: Optional training target data as a TIFF file or a directory containing TIFF files; passed directly to the training script. This is not required for self-supervised algorithms such as N2V.
        pattern: "*"
    - val_data:
        type: file
        description: Optional validation data as a TIFF file or a directory containing TIFF files; passed directly to the training script.
        pattern: "*"
    - val_target:
        type: file
        description: Optional validation target data as a TIFF file or a directory containing TIFF files; passed directly to the training script. This is not required for self-supervised algorithms such as N2V.
        pattern: "*"
output:
  model:
    - - meta:
          type: map
          description: Groovy Map containing sample information; passed through unchanged
      - "checkpoints/*/*last.ckpt":
          type: file
          description: Trained model checkpoint
          pattern: "checkpoints/*/*last.ckpt"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@tatianawoller"
  - "@melisande-c"
maintainers:
  - "@melisande-c"
