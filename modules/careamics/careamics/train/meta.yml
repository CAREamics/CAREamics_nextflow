# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_train
description: Train a CAREamics model from an existing CAREamics configuration file
keywords:
  - training
  - image restoration
  - image processing
  - microscopy
  - deep learning
  - careamics
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
      args_id: "$args"
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information; passed through unchanged
    - careamics_config:
        type: file
        description: CAREamics configuration file
        pattern: "*.yaml"
    - train_data:
        type: file
        description: Training data as a TIFF file or a directory containing TIFF files; passed directly to the training script.
        pattern: "*"
    - train_target:
        type: file
        description: Optional training target data as a TIFF file or a directory containing TIFF files; passed directly to the training script. This is not required for self-supervised algorithms such as N2V.
        pattern: "*"
        optional: true
    - val_data:
        type: file
        description: Optional validation data as a TIFF file or a directory containing TIFF files; passed directly to the training script.
        pattern: "*"
        optional: true
    - val_target:
        type: file
        description: Optional validation target data as a TIFF file or a directory containing TIFF files; passed directly to the training script. This is not required for self-supervised algorithms such as N2V.
        pattern: "*"
        optional: true
output:
  model:
    - - meta:
          type: map
          description: Groovy Map containing sample information; passed through unchanged
      - "checkpoints/*/*.ckpt":
          type: file
          description: Trained model checkpoint files
          pattern: "checkpoints/*/*.ckpt"
      - "checkpoints/*/checkpoint_record.json":
          type: file
          description: Record of the saved checkpoints and the checkpoint selected for prediction
          pattern: "checkpoints/*/checkpoint_record.json"
  metrics:
    - - meta:
          type: map
          description: Groovy Map containing sample information; passed through unchanged
      - csv_logs/*/version_*/metrics.csv:
          type: file
          description: Training and validation losses and additional logged metrics
          pattern: "csv_logs/*/version_*/metrics.csv"
  versions_careamics:
    - - ${task.process}:
          type: string
          description: The name of the process
      - careamics:
          type: string
          description: The name of the tool
      - python -c "import careamics; print(careamics.__version__)":
          type: eval
          description: The expression to obtain the version of CAREamics
  versions_torch:
    - - ${task.process}:
          type: string
          description: The name of the process
      - torch:
          type: string
          description: The name of the tool
      - python -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of PyTorch
  versions_cuda:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the CUDA toolkit
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: The expression to obtain the CUDA version used to build PyTorch
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python -c "import platform; print(platform.python_version())":
          type: eval
          description: The expression to obtain the version of Python

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - careamics:
          type: string
          description: The name of the tool
      - python -c "import careamics; print(careamics.__version__)":
          type: eval
          description: The expression to obtain the version of CAREamics
    - - ${task.process}:
          type: string
          description: The name of the process
      - torch:
          type: string
          description: The name of the tool
      - python -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of PyTorch
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the CUDA toolkit
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: The expression to obtain the CUDA version used to build PyTorch
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python -c "import platform; print(platform.python_version())":
          type: eval
          description: The expression to obtain the version of Python

authors:
