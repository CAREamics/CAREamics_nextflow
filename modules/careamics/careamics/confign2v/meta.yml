# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: careamics_confign2v
description: Create a Noise2Void (N2V) training configuration using CAREamics. Optional task.ext.args may include num_epochs, num_steps, augmentations, n_val_patches, use_n2v2, and n_channels.
keywords:
  - configuration
  - denoising
  - image restoration
  - image processing
  - microscopy
  - deep learning
  - careamics
  - noise2void
  - n2v
tools:
  - careamics:
      description: CAREamics is a library for content-aware image restoration in microscopy
      homepage: https://careamics.github.io
      documentation: https://careamics.github.io
      tool_dev_url: https://github.com/CAREamics/careamics
      licence: ["BSD-3-Clause"]
      args_id: "$args"
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information; passed through unchanged
    - experiment_name:
        type: string
        description: Name of the experiment. A valid experiment name is a non-empty string that only contains letters, numbers, underscores, dashes and spaces.
    - data_type:
        type: string
        description: Type of the data. One of array, tiff, zarr, czi, or custom.
    - axes:
        type: string
        description: Axes of the data (e.g. SYX).
    - patch_size:
        type: string
        description: Size of the patches along the spatial dimensions (e.g. 64 64).
    - batch_size:
        type: integer
        description: Batch size.
output:
  careamics_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information; passed through unchanged
      - careamics.yaml:
          type: file
          description: CAREamics configuration file
          pattern: "careamics.yaml"
  versions_careamics:
    - - ${task.process}:
          type: string
          description: The name of the process
      - careamics:
          type: string
          description: The name of the tool
      - python -c "import careamics; print(careamics.__version__)":
          type: eval
          description: The expression to obtain the version of CAREamics
  versions_torch:
    - - ${task.process}:
          type: string
          description: The name of the process
      - torch:
          type: string
          description: The name of the tool
      - python -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of PyTorch
  versions_cuda:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the CUDA toolkit
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: The expression to obtain the CUDA version used to build PyTorch
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python -c "import platform; print(platform.python_version())":
          type: eval
          description: The expression to obtain the version of Python

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - careamics:
          type: string
          description: The name of the tool
      - python -c "import careamics; print(careamics.__version__)":
          type: eval
          description: The expression to obtain the version of CAREamics
    - - ${task.process}:
          type: string
          description: The name of the process
      - torch:
          type: string
          description: The name of the tool
      - python -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of PyTorch
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the CUDA toolkit
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: The expression to obtain the CUDA version used to build PyTorch
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
